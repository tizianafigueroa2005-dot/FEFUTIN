<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEFUTIN Torneos</title>
    
    <!-- Cargamos Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cargamos FontAwesome para los íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Cargamos React -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Cargamos Babel para que el navegador entienda nuestro código JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Cargamos Firebase SDKs y tus credenciales -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDsWHNJw_sd5Gg1LbeYURBlBiix7NOuKYY",
        authDomain: "fefutin.firebaseapp.com",
        projectId: "fefutin",
        storageBucket: "fefutin.firebasestorage.app",
        messagingSenderId: "27709773699",
        appId: "1:27709773699:web:79345c6202bce03718c8b6",
        measurementId: "G-2E04TQJZ0S"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      
      // Exponemos las funciones de Firebase globalmente para React
      window.FB_db = db;
      window.FB_doc = doc;
      window.FB_setDoc = setDoc;
      window.FB_onSnapshot = onSnapshot;
    </script>

    <style>
        /* Oculta la barra de desplazamiento pero permite hacer scroll */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Mejora la barra de scroll de la lista de equipos */
        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        
        /* Animación para el láser biométrico */
        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scanner-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background-color: #4ade80;
            box-shadow: 0 0 8px #4ade80, 0 0 15px #4ade80;
            animation: scan 2s ease-in-out infinite;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-neutral-100">

    <!-- Aquí es donde React "dibujará" la aplicación -->
    <div id="root"></div>

    <!-- Nuestro código de la aplicación -->
    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // --- ADAPTACIÓN DE ÍCONOS PARA HTML ---
        const Icon = ({ name, size = 24, className = "", type = "fa-solid" }) => (
          <i className={`${type} fa-${name} ${className}`} style={{ fontSize: size }}></i>
        );
        const Trophy = (props) => <Icon name="trophy" {...props} />;
        const Medal = (props) => <Icon name="medal" {...props} />;
        const Star = (props) => <Icon name="star" {...props} />;
        const Users = (props) => <Icon name="users" {...props} />;
        const ArrowLeft = (props) => <Icon name="arrow-left" {...props} />;
        const ChevronRight = (props) => <Icon name="chevron-right" {...props} />;
        const Info = (props) => <Icon name="circle-info" {...props} />;
        const Shield = (props) => <Icon name="shield-halved" {...props} />;
        const TableIcon = (props) => <Icon name="table" {...props} />;
        const CalendarDays = (props) => <Icon name="calendar-days" {...props} />;
        const Clock = (props) => <Icon name="clock" type="fa-regular" {...props} />;
        const CheckCircle2 = (props) => <Icon name="circle-check" {...props} />;
        const Lock = (props) => <Icon name="lock" {...props} />;
        const Unlock = (props) => <Icon name="unlock" {...props} />;
        const Plus = (props) => <Icon name="plus" {...props} />;
        const Edit2 = (props) => <Icon name="pen" {...props} />;
        const X = (props) => <Icon name="xmark" {...props} />;
        const Save = (props) => <Icon name="floppy-disk" {...props} />;
        const Trash2 = (props) => <Icon name="trash" {...props} />;
        const Shirt = (props) => <Icon name="shirt" {...props} />;
        const UserPlus = (props) => <Icon name="user-plus" {...props} />;
        const IdCard = (props) => <Icon name="id-card" type="fa-regular" {...props} />;
        const Fingerprint = (props) => <Icon name="fingerprint" {...props} />;

        // URL del logo de la liga.
        const LOGO_URL = "https://yt3.googleusercontent.com/ytc/AIdro_k8JXexJVY6F3O_5kddNVf-HHJ_xnIOV6k1AbexrpaI9g=s900-c-k-c0x00ffffff-no-rj";

        // Estructura de disciplinas (Base)
        const initialTournamentData = {
          "FEMENINO": {
            title: "Femenino", icon: Trophy, color: "bg-amber-500",
            categories: [
              { 
                id: "femenino_unico", 
                name: "Divisiones", 
                divisions: [
                  { id: "fem_sub18", name: "Sub 18" },
                  { id: "fem_reserva", name: "Reserva" },
                  { id: "fem_primera", name: "Primera" },
                  { id: "fem_mas30", name: "+30" }
                ] 
              }
            ]
          },
          "SENIOR": { 
            title: "Senior", icon: Star, color: "bg-neutral-800", 
            categories: [
              { id: "senior", name: "Senior", divisions: [{ id: "senior30", name: "Senior +30" }, { id: "senior35", name: "Senior +35" }] },
              { id: "super_senior", name: "Super Senior", divisions: [{ id: "senior40", name: "Senior +40" }, { id: "senior45", name: "Senior +45" }] }
            ] 
          },
          "MASCULINO": { 
            title: "Masculino", icon: Users, color: "bg-red-600", 
            categories: [
              { 
                id: "masculino", 
                name: "Divisiones", 
                divisions: [
                  { id: "5ta", name: "5ta" },
                  { id: "4ta", name: "4ta" },
                  { id: "3ra", name: "3ra" },
                  { id: "reserva_masc", name: "Reserva" },
                  { id: "primera_masc", name: "Primera" }
                ] 
              }
            ] 
          },
          "INFANTIL": { title: "Infantil", icon: Medal, color: "bg-blue-600", categories: [] }
        };

        function App() {
          const [disciplines, setDisciplines] = useState(initialTournamentData);

          const [currentView, setCurrentView] = useState('disciplines'); 
          const [selectedDiscipline, setSelectedDiscipline] = useState(null);
          const [selectedCategory, setSelectedCategory] = useState(null);
          const [selectedDivision, setSelectedDivision] = useState(null);
          const [tournamentTab, setTournamentTab] = useState('posiciones'); 
          const [selectedRoundId, setSelectedRoundId] = useState(null);

          const [isAdmin, setIsAdmin] = useState(false);
          const [db, setDb] = useState({}); 
          
          const [modalConfig, setModalConfig] = useState(null); 
          const [formData, setFormData] = useState({});
          
          const [scanState, setScanState] = useState(null);

          // Sincronización en tiempo real con Firebase Firestore
          useEffect(() => {
            if (window.FB_db) {
              const docRef = window.FB_doc(window.FB_db, "fefutin", "torneos_data");
              const unsubscribe = window.FB_onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                  setDb(docSnap.data());
                }
              });
              return () => unsubscribe();
            }
          }, []);

          const updateDatabase = (updaterFunction) => {
            setDb(prev => {
              const newState = typeof updaterFunction === 'function' ? updaterFunction(prev) : updaterFunction;
              if (window.FB_db) {
                const docRef = window.FB_doc(window.FB_db, "fefutin", "torneos_data");
                window.FB_setDoc(docRef, newState).catch(err => console.error("Error al guardar en Firebase: ", err));
              }
              return newState;
            });
          };

          const currentData = db[selectedDivision?.id] || { teams: [], fixtures: [] };

          const categoryTeams = useMemo(() => {
            if (!selectedCategory || !selectedCategory.divisions.length) return [];
            const firstDivId = selectedCategory.divisions[0].id;
            return db[firstDivId]?.teams || [];
          }, [db, selectedCategory]);

          const standings = useMemo(() => {
            let stats = currentData.teams.map(t => ({ ...t, pts: 0, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0 }));

            currentData.fixtures.forEach(f => {
              f.matches.forEach(m => {
                if (m.status === 'FINALIZADO') {
                  let home = stats.find(t => t.name === m.home);
                  let away = stats.find(t => t.name === m.away);
                  if (home && away) {
                    home.pj++; away.pj++;
                    home.gf += Number(m.homeScore); home.gc += Number(m.awayScore);
                    away.gf += Number(m.awayScore); away.gc += Number(m.homeScore);
                    
                    if (Number(m.homeScore) > Number(m.awayScore)) {
                      home.pts += 3; home.pg++; away.pp++;
                    } else if (Number(m.homeScore) < Number(m.awayScore)) {
                      away.pts += 3; away.pg++; home.pp++;
                    } else {
                      home.pts += 1; away.pts += 1; home.pe++; away.pe++;
                    }
                  }
                }
              });
            });

            stats.forEach(t => t.dif = t.gf - t.gc);
            stats.sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.gf - a.gf || a.name.localeCompare(b.name));
            return stats.map((t, i) => ({ ...t, pos: i + 1 }));
          }, [currentData]);

          const generalStandings = useMemo(() => {
            if (!selectedCategory) return [];
            
            const globalStats = {};

            selectedCategory.divisions.forEach(div => {
              const divData = db[div.id] || { teams: [], fixtures: [] };
              
              divData.teams.forEach(team => {
                const teamNameUpper = team.name.toUpperCase();
                if (!globalStats[teamNameUpper]) {
                  globalStats[teamNameUpper] = { id: team.id, name: team.name, logo: team.logo, pts: 0, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, dif: 0 };
                }
              });

              divData.fixtures.forEach(f => {
                f.matches.forEach(m => {
                  if (m.status === 'FINALIZADO') {
                    let homeName = m.home.toUpperCase();
                    let awayName = m.away.toUpperCase();
                    
                    if (globalStats[homeName] && globalStats[awayName]) {
                      globalStats[homeName].pj++; 
                      globalStats[awayName].pj++;
                      globalStats[homeName].gf += Number(m.homeScore); 
                      globalStats[homeName].gc += Number(m.awayScore);
                      globalStats[awayName].gf += Number(m.awayScore); 
                      globalStats[awayName].gc += Number(m.homeScore);
                      
                      if (Number(m.homeScore) > Number(m.awayScore)) {
                        globalStats[homeName].pts += 3; globalStats[homeName].pg++; globalStats[awayName].pp++;
                      } else if (Number(m.homeScore) < Number(m.awayScore)) {
                        globalStats[awayName].pts += 3; globalStats[awayName].pg++; globalStats[homeName].pp++;
                      } else {
                        globalStats[homeName].pts += 1; globalStats[awayName].pts += 1; globalStats[homeName].pe++; globalStats[awayName].pe++;
                      }
                    }
                  }
                });
              });
            });

            const statsArray = Object.values(globalStats);
            statsArray.forEach(t => t.dif = t.gf - t.gc);
            statsArray.sort((a, b) => b.pts - a.pts || b.dif - a.dif || b.gf - a.gf || a.name.localeCompare(b.name));
            return statsArray.map((t, i) => ({ ...t, pos: i + 1 }));
          }, [db, selectedCategory]);

          const modalTeam = useMemo(() => {
            if (modalConfig?.type === 'ROSTER' && selectedDivision) {
              return db[selectedDivision.id]?.teams.find(t => t.id === formData.teamId) || null;
            }
            return null;
          }, [db, modalConfig, selectedDivision, formData.teamId]);

          const teamMatches = useMemo(() => {
            if (!modalTeam) return [];
            return currentData.fixtures.flatMap(f => 
              f.matches
               .filter(m => m.home === modalTeam.name || m.away === modalTeam.name)
               .map(m => ({...m, round: f.round}))
            );
          }, [currentData.fixtures, modalTeam]);

          const handlePhotoUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => setFormData(prev => ({ ...prev, playerPhotoBase64: reader.result }));
                reader.readAsDataURL(file);
            }
          };

          const handleDniPhotoUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => setFormData(prev => ({ ...prev, playerDniPhotoBase64: reader.result }));
                reader.readAsDataURL(file);
            }
          };

          const handleTeamPhotoUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => setFormData(prev => ({ ...prev, teamPhotoBase64: reader.result }));
                reader.readAsDataURL(file);
            }
          };

          const saveTeam = () => {
            if(!formData.name) return;
            const newTeamName = formData.name;
            const newTeamLogo = formData.teamPhotoBase64 || `https://ui-avatars.com/api/?name=${formData.name.substring(0,2)}&background=random&color=fff`;

            updateDatabase(prev => {
              const newState = { ...prev };
              selectedCategory.divisions.forEach(div => {
                const divData = newState[div.id] || { teams: [], fixtures: [] };
                if (!divData.teams.some(t => t.name.toLowerCase() === newTeamName.toLowerCase())) {
                  newState[div.id] = {
                    ...divData,
                    teams: [
                      ...divData.teams, 
                      { id: `${Date.now()}-${div.id}`, name: newTeamName, logo: newTeamLogo, coach: '', players: [] } 
                    ]
                  };
                }
              });
              return newState;
            });
            setFormData({ name: '', teamPhotoBase64: null });
          };

          const saveFecha = () => {
            if(!formData.round) return;
            const newFecha = { id: `f${Date.now()}`, round: formData.round, matches: [] };
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id] || { teams: [], fixtures: [] };
              return { ...prev, [selectedDivision.id]: { ...divData, fixtures: [...divData.fixtures, newFecha] } };
            });
            setSelectedRoundId(newFecha.id);
            closeModal();
          };

          const saveMatch = () => {
            if(!formData.home || !formData.away) return;
            const homeTeam = currentData.teams.find(t => t.id === formData.home);
            const awayTeam = currentData.teams.find(t => t.id === formData.away);
            
            const newMatch = {
              id: Date.now(), home: homeTeam.name, away: awayTeam.name,
              homeLogo: homeTeam.logo, awayLogo: awayTeam.logo,
              date: formData.date || "Por definir", status: "PROGRAMADO"
            };

            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedFixtures = divData.fixtures.map(f => 
                f.id === formData.roundId ? { ...f, matches: [...f.matches, newMatch] } : f
              );
              return { ...prev, [selectedDivision.id]: { ...divData, fixtures: updatedFixtures } };
            });
            closeModal();
          };

          const saveResult = () => {
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedFixtures = divData.fixtures.map(f => {
                if(f.id === formData.roundId) {
                  const updatedMatches = f.matches.map(m => 
                    m.id === formData.matchId 
                      ? { ...m, homeScore: formData.homeScore, awayScore: formData.awayScore, status: "FINALIZADO" } 
                      : m
                  );
                  return { ...f, matches: updatedMatches };
                }
                return f;
              });
              return { ...prev, [selectedDivision.id]: { ...divData, fixtures: updatedFixtures } };
            });
            closeModal();
          };

          const savePlayer = () => {
            if(!formData.playerName || !formData.playerDni || !formData.playerDob) {
              setFormData(prev => ({...prev, rosterError: "Completa Nombre, DNI y Fecha de Nacimiento."}));
              return;
            }

            if (formData.playerPhotoBase64 && formData.playerDniPhotoBase64 && !scanState) {
                setScanState('scanning');
                setTimeout(() => {
                    setScanState('success');
                    setTimeout(() => executeSavePlayer(), 1500);
                }, 2500);
                return;
            }
            executeSavePlayer();
          };

          const executeSavePlayer = () => {
            const newPlayer = {
              id: Date.now(),
              name: formData.playerName,
              dni: formData.playerDni,
              dob: formData.playerDob,
              photo: formData.playerPhotoBase64 || `https://ui-avatars.com/api/?name=${formData.playerName.substring(0,2)}&background=f3f4f6&color=153465`,
              dniPhoto: formData.playerDniPhotoBase64 || null,
              goles: 0, juegos: 0, amarillas: 0, rojas: 0, faltas: 0
            };

            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedTeams = divData.teams.map(t => {
                if (t.id === formData.teamId) {
                  return { ...t, players: [...(t.players || []), newPlayer] };
                }
                return t;
              });
              return { ...prev, [selectedDivision.id]: { ...divData, teams: updatedTeams } };
            });

            setScanState(null);
            setFormData(prev => ({ ...prev, playerName: '', playerDni: '', playerDob: '', playerPhotoBase64: null, playerDniPhotoBase64: null, rosterError: null, isAddingPlayer: false }));
          };

          const updateCoach = (newCoach) => {
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedTeams = divData.teams.map(t => {
                if (t.id === formData.teamId) {
                  return { ...t, coach: newCoach };
                }
                return t;
              });
              return { ...prev, [selectedDivision.id]: { ...divData, teams: updatedTeams } };
            });
          };

          const executeDeleteTeam = (teamName) => {
            updateDatabase(prev => {
              const newState = { ...prev };
              selectedCategory.divisions.forEach(div => {
                if (newState[div.id]) {
                  newState[div.id] = {
                    ...newState[div.id],
                    teams: newState[div.id].teams.filter(t => t.name !== teamName)
                  };
                }
              });
              return newState;
            });
          };

          const executeDeleteFecha = () => {
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              return { ...prev, [selectedDivision.id]: { ...divData, fixtures: divData.fixtures.filter(f => f.id !== formData.roundId) } };
            });
            if (selectedRoundId === formData.roundId) setSelectedRoundId(null);
            closeModal();
          };

          const executeDeleteMatch = () => {
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedFixtures = divData.fixtures.map(f => 
                f.id === formData.roundId ? { ...f, matches: f.matches.filter(m => m.id !== formData.matchId) } : f
              );
              return { ...prev, [selectedDivision.id]: { ...divData, fixtures: updatedFixtures } };
            });
            closeModal();
          };

          const executeDeletePlayer = (playerId) => {
            updateDatabase(prev => {
              const divData = prev[selectedDivision.id];
              const updatedTeams = divData.teams.map(t => {
                if (t.id === formData.teamId) {
                  return { ...t, players: t.players.filter(p => p.id !== playerId) };
                }
                return t;
              });
              return { ...prev, [selectedDivision.id]: { ...divData, teams: updatedTeams } };
            });
          };

          const saveDiscipline = () => {
            if(!formData.disciplineName) return;
            const newKey = formData.disciplineName.toUpperCase().replace(/\s+/g, '_');
            setDisciplines(prev => ({
              ...prev,
              [newKey]: {
                title: formData.disciplineName,
                icon: Trophy,
                color: "bg-emerald-600",
                categories: [
                  { 
                    id: `${newKey.toLowerCase()}_unico`, 
                    name: "Divisiones", 
                    divisions: [{ id: `${newKey.toLowerCase()}_unica`, name: "Única" }] 
                  }
                ]
              }
            }));
            closeModal();
          };

          const openModal = (type, initialData = {}) => {
            setModalConfig({ type });
            setFormData(initialData);
          };
          const closeModal = () => { setModalConfig(null); setFormData({}); };

          const handleSelectDivision = (division) => {
            setSelectedDivision(division);
            setCurrentView('tournament');
            setTournamentTab('posiciones');
            const divData = db[division.id];
            setSelectedRoundId(divData?.fixtures?.[0]?.id || null);
          };

          return (
            <div className="min-h-screen bg-neutral-100 font-sans text-neutral-900 pb-20">
              <header className="bg-black text-white shadow-md sticky top-0 z-20 border-b-2 border-red-600">
                <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <img src={LOGO_URL} alt="Logo" className="w-12 h-12 rounded-full object-cover border-2 border-white bg-white" />
                    <h1 className="text-2xl font-black tracking-wider uppercase text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-red-400">FEFUTIN</h1>
                  </div>
                  <button 
                    onClick={() => setIsAdmin(!isAdmin)}
                    className={`flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold transition-colors border ${isAdmin ? 'bg-red-600 border-red-500 text-white shadow-[0_0_15px_rgba(220,38,38,0.5)]' : 'bg-neutral-900 border-neutral-700 text-neutral-400 hover:text-white'}`}
                  >
                    {isAdmin ? <Unlock size={14} /> : <Lock size={14} />}
                    {isAdmin ? 'ADMIN ACTIVADO' : 'MODO ADMIN'}
                  </button>
                </div>
              </header>

              <main className="max-w-4xl mx-auto px-4 py-8">
                {currentView === 'disciplines' && (
                  <div>
                    <div className="mb-8 text-center">
                      <h2 className="text-3xl font-bold mb-2">Selecciona una Disciplina</h2>
                      <p className="text-neutral-500">Elige la categoría principal para ver sus zonas y torneos.</p>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {Object.entries(disciplines).map(([key, data]) => {
                        const IconElement = data.icon;
                        return (
                          <button key={key} onClick={() => { 
                            setSelectedDiscipline(key); 
                            if (data.categories.length === 1) {
                              setSelectedCategory(data.categories[0]);
                              setCurrentView('divisions');
                            } else {
                              setCurrentView('categories'); 
                            }
                          }} className="group relative flex flex-col p-6 bg-white rounded-2xl shadow-sm border border-neutral-200 hover:border-red-600 transition-all text-left overflow-hidden">
                            <div className={`absolute -right-12 -top-12 w-32 h-32 rounded-full opacity-10 transition-transform group-hover:scale-150 ${data.color}`}></div>
                            <div className="flex items-center justify-between mb-4 relative z-10">
                              <div className={`p-3 rounded-xl text-white shadow-md ${data.color}`}><IconElement size={28} /></div>
                              <ChevronRight className="text-neutral-300 group-hover:text-red-600" size={24} />
                            </div>
                            <h3 className="text-xl font-bold mb-1 relative z-10">{data.title}</h3>
                          </button>
                        );
                      })}
                      
                      {isAdmin && (
                        <button onClick={() => openModal('ADD_DISCIPLINE')} className="group relative flex flex-col items-center justify-center p-6 bg-neutral-50 rounded-2xl shadow-sm border-2 border-dashed border-neutral-300 hover:border-emerald-500 transition-all text-center h-full min-h-[160px]">
                          <div className="p-3 rounded-full bg-emerald-100 text-emerald-600 mb-3 group-hover:scale-110 transition-transform"><Plus size={28}/></div>
                          <h3 className="text-xl font-bold text-neutral-600 group-hover:text-emerald-700">Nueva Disciplina</h3>
                        </button>
                      )}
                    </div>
                  </div>
                )}

                {currentView === 'categories' && selectedDiscipline && (
                  <div>
                    <button onClick={() => setCurrentView('disciplines')} className="flex items-center gap-2 text-neutral-500 hover:text-red-600 font-medium mb-6 px-2 py-1 -ml-2 rounded-lg hover:bg-neutral-200">
                      <ArrowLeft size={20} /> Volver a Disciplinas
                    </button>
                    <div className="bg-white rounded-3xl p-8 shadow-sm border border-neutral-200">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {disciplines[selectedDiscipline].categories.map((cat) => (
                          <button key={cat.id} onClick={() => { setSelectedCategory(cat); setCurrentView('divisions'); }} className="flex items-center justify-between p-5 bg-neutral-50 rounded-2xl border border-neutral-200 hover:border-red-500 group text-left">
                            <h3 className="text-lg font-bold group-hover:text-red-700">{cat.name}</h3>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {currentView === 'divisions' && selectedCategory && (
                  <div>
                    <button onClick={() => {
                      if (disciplines[selectedDiscipline].categories.length === 1) {
                        setSelectedDiscipline(null);
                        setSelectedCategory(null);
                        setCurrentView('disciplines');
                      } else {
                        setCurrentView('categories');
                      }
                    }} className="flex items-center gap-2 text-neutral-500 hover:text-red-600 font-medium mb-6">
                      <ArrowLeft size={20} /> Volver
                    </button>
                    <div className="bg-white rounded-3xl p-8 shadow-sm border border-neutral-200">
                      {isAdmin && selectedCategory.divisions.length > 0 && (
                        <button onClick={() => openModal('MANAGE_TEAMS')} className="mb-8 w-full py-4 border-2 border-dashed border-red-300 bg-red-50 text-red-600 rounded-xl hover:bg-red-100 font-bold flex items-center justify-center gap-2">
                          <Users size={20} /> Gestionar Equipos
                        </button>
                      )}

                      <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <button onClick={() => setCurrentView('general_table')} className="col-span-1 sm:col-span-2 md:col-span-3 mb-2 flex flex-col items-center justify-center p-6 bg-[#153465] text-white rounded-2xl">
                           <TableIcon size={26} className="text-[#fbd535] mb-2" />
                           <h3 className="text-xl font-black uppercase tracking-widest">Tabla General de Clubes</h3>
                        </button>

                        {selectedCategory.divisions.map((division) => (
                          <button key={division.id} onClick={() => handleSelectDivision(division)} className="flex flex-col items-center justify-center p-6 bg-neutral-50 rounded-2xl border border-neutral-200 hover:border-red-500 group">
                            <h3 className="text-xl font-bold group-hover:text-red-700">{division.name}</h3>
                          </button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {currentView === 'general_table' && selectedCategory && (
                  <div>
                    <button onClick={() => setCurrentView('divisions')} className="flex items-center gap-2 text-neutral-500 mb-6"><ArrowLeft size={20} /> Volver</button>
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-neutral-200">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="bg-neutral-900 text-white text-sm">
                            <th className="p-4">#</th>
                            <th className="p-4">Club</th>
                            <th className="p-4 text-center">Pts</th>
                          </tr>
                        </thead>
                        <tbody>
                          {generalStandings.map((club, index) => (
                            <tr key={club.id} className="border-b">
                              <td className="p-4">{index + 1}</td>
                              <td className="p-4 font-bold">{club.name}</td>
                              <td className="p-4 text-center font-black text-red-600">{club.pts}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {currentView === 'tournament' && selectedDivision && (
                  <div>
                    <button onClick={() => setCurrentView('divisions')} className="flex items-center gap-2 text-neutral-500 mb-6"><ArrowLeft size={20} /> Volver</button>
                    <div className="bg-white p-6 rounded-t-3xl border">
                      <h2 className="text-2xl font-black uppercase">División {selectedDivision.name}</h2>
                    </div>
                    <div className="bg-white border-x px-6 flex gap-4">
                      <button onClick={() => setTournamentTab('posiciones')} className={`py-3 font-bold ${tournamentTab === 'posiciones' ? 'border-b-2 border-red-600 text-red-600' : 'text-neutral-500'}`}>Posiciones</button>
                      <button onClick={() => setTournamentTab('fechas')} className={`py-3 font-bold ${tournamentTab === 'fechas' ? 'border-b-2 border-red-600 text-red-600' : 'text-neutral-500'}`}>Fechas y Resultados</button>
                    </div>
                    <div className="bg-white rounded-b-3xl p-6 border">
                      {tournamentTab === 'posiciones' && (
                        <table className="w-full">
                          <thead>
                            <tr className="bg-neutral-100 text-sm">
                              <th className="p-3">#</th>
                              <th className="p-3">Equipo</th>
                              <th className="p-3 text-center">Pts</th>
                            </tr>
                          </thead>
                          <tbody>
                            {standings.map((team, index) => (
                              <tr key={team.id} className="border-b">
                                <td className="p-3">{index + 1}</td>
                                <td className="p-3 font-bold cursor-pointer text-blue-600" onClick={() => openModal('ROSTER', { teamId: team.id })}>{team.name}</td>
                                <td className="p-3 text-center font-black text-red-600">{team.pts}</td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      )}
                      {tournamentTab === 'fechas' && (
                        <div>
                          {isAdmin && (
                            <button onClick={() => openModal('FECHA')} className="mb-4 bg-red-600 text-white px-4 py-2 rounded-lg font-bold">Nueva Fecha</button>
                          )}
                          <div className="flex gap-2 overflow-x-auto pb-4">
                            {currentData.fixtures.map(f => (
                              <button key={f.id} onClick={() => setSelectedRoundId(f.id)} className={`px-4 py-2 rounded-full font-bold ${selectedRoundId === f.id ? 'bg-neutral-900 text-white' : 'bg-neutral-200'}`}>{f.round}</button>
                            ))}
                          </div>
                          {isAdmin && selectedRoundId && (
                            <button onClick={() => openModal('MATCH', { roundId: selectedRoundId })} className="bg-red-500 text-white px-3 py-1 rounded-md text-xs font-bold mb-4">Programar Partido</button>
                          )}
                          {currentData.fixtures.find(f => f.id === selectedRoundId)?.matches.map(m => (
                            <div key={m.id} className="bg-neutral-50 p-4 rounded-xl border mb-3 flex justify-between items-center">
                              <span>{m.home} vs {m.away}</span>
                              <span className="font-bold">{m.status === 'FINALIZADO' ? `${m.homeScore} - ${m.awayScore}` : m.date}</span>
                              {isAdmin && <button onClick={() => openModal('RESULT', { matchId: m.id, roundId: selectedRoundId, homeScore: m.homeScore || 0, awayScore: m.awayScore || 0 })} className="bg-neutral-800 text-white px-2 py-1 rounded text-xs">Cargar Resultado</button>}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </main>

              {modalConfig && (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                  <div className="bg-white rounded-3xl p-6 w-full max-w-md relative">
                    <button onClick={closeModal} className="absolute top-4 right-4"><X size={20}/></button>

                    {modalConfig.type === 'MANAGE_TEAMS' && (
                      <div>
                        <h3 className="text-xl font-black mb-4">Gestionar Equipos</h3>
                        <input type="text" className="w-full border p-2 rounded mb-2" placeholder="Nombre del Equipo" value={formData.name || ''} onChange={e => setFormData({...formData, name: e.target.value})} />
                        <button onClick={saveTeam} className="w-full bg-red-600 text-white font-bold py-2 rounded">Guardar Equipo</button>
                      </div>
                    )}

                    {modalConfig.type === 'FECHA' && (
                      <div>
                        <h3 className="text-xl font-black mb-4">Nueva Fecha</h3>
                        <input type="text" className="w-full border p-2 rounded mb-2" placeholder="Ej: Fecha 1" value={formData.round || ''} onChange={e => setFormData({...formData, round: e.target.value})} />
                        <button onClick={saveFecha} className="w-full bg-red-600 text-white font-bold py-2 rounded">Crear</button>
                      </div>
                    )}

                    {modalConfig.type === 'MATCH' && (
                      <div>
                        <h3 className="text-xl font-black mb-4">Programar Partido</h3>
                        <select className="w-full border p-2 rounded mb-2" onChange={e => setFormData({...formData, home: e.target.value})}>
                          <option value="">Local...</option>
                          {currentData.teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <select className="w-full border p-2 rounded mb-2" onChange={e => setFormData({...formData, away: e.target.value})}>
                          <option value="">Visitante...</option>
                          {currentData.teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                        </select>
                        <input type="text" className="w-full border p-2 rounded mb-2" placeholder="Fecha y hora" value={formData.date || ''} onChange={e => setFormData({...formData, date: e.target.value})} />
                        <button onClick={saveMatch} className="w-full bg-red-600 text-white font-bold py-2 rounded">Guardar</button>
                      </div>
                    )}

                    {modalConfig.type === 'RESULT' && (
                      <div>
                        <h3 className="text-xl font-black mb-4">Cargar Resultado</h3>
                        <div className="flex gap-4 mb-4">
                          <input type="number" className="w-20 border p-2 text-center text-xl" value={formData.homeScore} onChange={e => setFormData({...formData, homeScore: e.target.value})} />
                          <input type="number" className="w-20 border p-2 text-center text-xl" value={formData.awayScore} onChange={e => setFormData({...formData, awayScore: e.target.value})} />
                        </div>
                        <button onClick={saveResult} className="w-full bg-neutral-900 text-white font-bold py-2 rounded">Guardar Resultado</button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
